<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      {% if form.instance.pk %}Edit Task{% else %}Create Task{% endif %}
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #333;
      }

      header {
        background: #4f46e5;
        padding: 1rem 2rem;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header a {
        color: white;
        text-decoration: underline;
      }

      .form-container {
        width: 90%;
        max-width: 600px;
        margin: 2rem auto; /* Less vertical space */
        background: white;
        padding: 1.2rem 1rem; /* Reduced padding inside card */
        border-radius: 16px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04);
      }

      h2 {
        text-align: center;
        margin-bottom: 1rem;
        font-size: 1.5rem;
        color: #1f2937;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        margin-bottom: 0.4rem;
        margin-top: 0.8rem;
        color: #374151;
      }

      input[type="text"],
      textarea {
        padding: 0.65rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
        background: #f9fafb;
        transition: border 0.3s ease;
      }

      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: #4f46e5;
        background: #fff;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      .btn-submit {
        margin-top: 1.5rem;
        background: #4f46e5;
        color: white;
        padding: 0.7rem;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .btn-submit:hover {
        background: #4338ca;
      }

      .back-link {
        display: block;
        margin-top: 1.2rem;
        text-align: center;
        text-decoration: none;
        color: #4f46e5;
        font-weight: 600;
      }

      @media (max-height: 600px) {
        .form-container {
          margin: 2rem auto;
          padding: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        {% if form.instance.pk %}Edit Task{% else %}Create Task{% endif %}
      </h1>
      <a href="{% url 'task_list' %}">← Back</a>
    </header>

    <div class="form-container">
      <h2>{% if form.instance.pk %}Update Task{% else %}New Task{% endif %}</h2>
      <form method="post">
        {% csrf_token %} {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }} {% if field.errors %}
        <p style="color: red; font-size: 0.9rem">
          {{ field.errors|striptags }}
        </p>
        {% endif %} {% endfor %}
        <button class="btn-submit" type="submit">Save Task</button>
      </form>
      <a href="{% url 'task_list' %}" class="back-link">← Back to Task List</a>
    </div>
  </body>
</html>
